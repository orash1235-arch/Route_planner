{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-200 dark:border-slate-800">
        <a href="{{ url_for('trips.list_trips') }}" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700/60 border border-slate-200 dark:border-slate-700 px-3.5 py-2 rounded-lg shadow-xs transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span data-en="Back to Expeditions" data-he="חזרה לנסיעות">Back to Expeditions</span>
        </a>
        <div class="text-right">
            <h1 class="text-xl font-bold text-slate-900 dark:text-white" data-en="New Expedition Setup" data-he="יצירת נסיעה חדשה">New Expedition Setup</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400" data-en="Configure vehicle, crew, and planned route sites" data-he="הגדרת רכב, צוות ואתרים מתוכננים">Configure vehicle, crew, and planned route sites</p>
        </div>
    </div>

    <form id="expedition-form" action="{{ url_for('trips.new_ride') }}" method="POST" class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 sm:p-8 space-y-8">
        
        <section class="space-y-4">
            <div class="flex items-center gap-2 border-b border-slate-100 dark:border-slate-800 pb-2">
                <span class="w-6 h-6 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold">1</span>
                <h2 class="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider" data-en="General Information" data-he="פרטי נסיעה כלליים">General Information</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-en="Select Vehicle *" data-he="בחר רכב *">Select Vehicle *</label>
                    <div id="car-select-wrapper" class="relative rounded-lg transition-all duration-300">
                        <select id="car-select" name="license_plate" required onchange="handleCarSelect(this)" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="" disabled selected data-en="-- Select a vehicle from fleet --" data-he="-- בחר רכב --">-- Select a vehicle from fleet --</option>
                            {% for car in cars %}
                                <option value="{{ car.license_plate }}" 
                                        data-status="{{ 'On Ride' if car.is_on_ride else 'Available' }}">
                                    {{ car.car_type }} — [{{ car.license_plate }}]
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div>
   
    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1"
           data-en="Expedition Commander *" data-he="מפקד משלח *">Expedition Commander *</label>
    <select name="commander" required
            class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="" disabled selected data-en="Select a commander" data-he="בחר מפקד">Select a commander</option>
        {% for soldier in commanders %}
            <option value="{{ soldier.id }}">{{ soldier.full_name if soldier.full_name else soldier.name }}</option>
        {% endfor %}
    </select>
</div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-en="Departure Date *" data-he="תאריך יציאה *">Departure Date *</label>
                    <input type="date" name="departure_date" required class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-en="Departure Time *" data-he="זמן יציאה *">Departure Time *</label>
                    <input type="time" name="departure_time" value="08:00" required class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-en="Est. Duration (Hours)" data-he="זמן משוער (שעות)">Est. Duration (Hours)</label>
                    <input type="number" name="est_duration" step="0.5" placeholder="6.5" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex items-center gap-2 border-b border-slate-100 dark:border-slate-800 pb-2">
                <span class="w-6 h-6 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold">2</span>
                <h2 class="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider" data-en="Crew Assignments" data-he="שיבוץ צוות">Crew Assignments</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-en="Driver *" data-he="נהג *">Driver *</label>
    <select name="driver" required class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
        <option value="" disabled selected data-en="Select a driver" data-he="בחר נהג">Select a driver</option>
        {% for soldier in drivers %}
            <option value="{{ soldier.full_name if soldier.full_name else soldier.name }}">{{ soldier.full_name if soldier.full_name else soldier.name }}</option>
        {% endfor %}
    </select>
</div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-en="Mission Supervisor *" data-he="מפקד משימה *">Mission Supervisor *</label>
                    <input type="text" name="supervisor" required placeholder="Supervisor Name" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1" data-en="Additional Passengers" data-he="נוסעים נוספים">Additional Passengers</label>
                    <input type="text" name="passengers" placeholder="e.g. John D., Michael P. (comma separated)" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold">3</span>
                    <h2 class="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider" data-en="Assigned Sites" data-he="אתרים מתוכננים">Assigned Sites</h2>
                </div>
                <button type="button" onclick="addSiteField()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/50 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 px-3 py-1.5 rounded-lg transition cursor-pointer">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span data-en="Add Another Site" data-he="הוסף אתר נוסף">Add Another Site</span>
                </button>
            </div>

            <div id="sites-container" class="space-y-4">
                <div class="site-block border border-slate-200 dark:border-slate-800 rounded-xl p-4 bg-slate-50 dark:bg-slate-800/50 space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="sm:col-span-2">
                            <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1" data-en="Site Name & ID *" data-he="שם/מספר אתר *">Site Name & ID *</label>
                            <input type="text" name="site_name[]" required placeholder="Site Alpha (#LOC-1024)" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1" data-en="Difficulty Level" data-he="רמת מורכבות">Difficulty / Risk Level</label>
                            <select name="site_difficulty[]" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option data-en="Easy" data-he="קל" value="Easy (L1)">Easy (L1)</option>
                                <option data-en="Medium" data-he="בינוני" value="Medium (L2)">Medium (L2)</option>
                                <option data-en="Hard" data-he="קשה" value="Hard (L3)">Hard (L3)</option>
                                <option data-en="Severe" data-he="חמור" value="Severe (L4)">Severe (L4)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1" data-en="Work Description" data-he="מהות העבודה">Work Description</label>
                        <input type="text" name="site_description[]" placeholder="e.g. Fiber optic splice repair & transceiver swap" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-2">
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300" data-en="Additional Instructions / Safety Notes" data-he="הערות ודגשים נוספים">Additional Instructions / Safety Notes</label>
            <textarea name="notes" rows="3" placeholder="Verify gate access codes prior to arrival, carry specialized harness gear, etc." class="w-full text-xs p-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </section>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end items-center gap-3">
            <a href="{{ url_for('trips.list_trips') }}" class="px-4 py-2.5 text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition" data-en="Cancel" data-he="ביטול">
                Cancel
            </a>
            
            <button type="submit" name="action" value="draft" formnovalidate class="px-4 py-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 dark:active:bg-slate-600 rounded-lg shadow-2xs transition cursor-pointer" data-en="Save as Draft" data-he="שמור כטיוטה">
                Save as Draft
            </button>

            <button type="submit" name="action" value="publish" class="px-6 py-2.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-lg shadow-xs transition cursor-pointer" data-en="Save Expedition" data-he="שמור נסיעה">
                Save Expedition
            </button>
        </div>

    </form>
</div>

<script>
    function addSiteField() {
        const container = document.getElementById('sites-container');
        const siteIndex = container.children.length + 1;
        
        const siteHTML = `
            <div class="site-block border border-slate-200 dark:border-slate-800 rounded-xl p-4 bg-slate-50 dark:bg-slate-800/50 space-y-3 relative pt-8">
                <button type="button" onclick="this.parentElement.remove()" class="absolute top-2.5 right-3 text-xs text-rose-600 dark:text-rose-400 hover:text-rose-800 dark:hover:text-rose-300 font-semibold inline-flex items-center gap-1 cursor-pointer">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Remove
                </button>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="sm:col-span-2">
                        <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1">Site Name & ID *</label>
                        <input type="text" name="site_name[]" required placeholder="Site ${siteIndex} (#LOC-XXXX)" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1">Difficulty / Risk Level</label>
                        <select name="site_difficulty[]" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Easy (L1)">Easy (L1)</option>
                            <option value="Medium (L2)">Medium (L2)</option>
                            <option value="Hard (L3)">Hard (L3)</option>
                            <option value="Severe (L4)">Severe (L4)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 dark:text-slate-400 mb-1">Work Description</label>
                    <input type="text" name="site_description[]" placeholder="Describe tasks..." class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', siteHTML);
    }

    function handleCarSelect(selectElement) {
        const selectedOption = selectElement.options[selectElement.selectedIndex];
        const wrapper = document.getElementById('car-select-wrapper');
        const status = selectedOption.getAttribute('data-status');

        selectElement.classList.remove('border-rose-500', 'border-emerald-500');
        wrapper.className = 'relative rounded-lg transition-all duration-300';

        if (status === 'On Ride') {
            selectElement.classList.add('border-rose-500');
            wrapper.classList.add('ring-4', 'ring-rose-500/20', 'shadow-md', 'shadow-rose-500/10');
        } else if (status === 'Available') {
            selectElement.classList.add('border-emerald-500');
            wrapper.classList.add('ring-4', 'ring-emerald-500/20', 'shadow-md', 'shadow-emerald-500/10');
        }
    }
</script>
{% endblock %}
