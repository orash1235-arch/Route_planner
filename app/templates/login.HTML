{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white dark:bg-slate-800 p-8 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-1 text-center" data-en="Log In" data-he="התחברות">
        Log In
    </h2>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-6 text-center" data-en="Enter your User ID and password to access the platform." data-he="הזן מזהה משתמש וסיסמה כדי להכנס למערכת.">
        Enter your User ID and password to access the platform.
    </p>

    <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase mb-1" data-en="ID" data-he="תעודת זהות">
                ID
            </label>
            <input type="text" name="user_id" required placeholder="Enter User ID" data-en-placeholder="Enter User ID" data-he-placeholder="הזן מזהה משתמש"
                   class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase mb-1" data-en="Password" data-he="סיסמה">
                Password
            </label>
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-sm" data-en="Log In" data-he="התחבר">
            Log In
        </button>
    </form>

    <p class="text-xs text-center text-slate-500 dark:text-slate-400 mt-4">
        <span data-en="Don't have an account?" data-he="אין לך חשבון?">Don't have an account?</span> 
        <a href="{{ url_for('auth.register') }}" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline" data-en="Register" data-he="הרשם עכשיו">Register</a>
    </p>
</div>
{% endblock %}
